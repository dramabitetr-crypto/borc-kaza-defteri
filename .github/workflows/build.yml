name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: Sabit imza ve sürüm numarası
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p).read()
          imza = """android {
              signingConfigs {
                  debug {
                      storeFile file('../../imza/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }"""
          s = s.replace("android {", imza, 1)
          open(p, "w").write(s)
          PY
          grep -nE "versionCode|versionName|storeFile" $G

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasına isim ver
        run: mv android/app/build/outputs/apk/debug/app-debug.apk BorcKazaDefteri-v${{ github.run_number }}.apk

      - name: Sürüm sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sürüm ${{ github.run_number }}
          files: BorcKazaDefteri-v${{ github.run_number }}.apk
